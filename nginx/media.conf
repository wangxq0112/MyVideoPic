# ═══════════════════════════════════════════════════════════
# MyVideoPic — Nginx 配置（可选）
#
# 不用 Nginx 也能跑：Django 自己就实现了 HTTP 206 Range，拖进度条正常。
# 上 Nginx 只为一件事 —— 把大文件的字节搬运交给内核 sendfile，
# 播放 4K/蓝光原盘时 Python 进程不再被占满。
#
# 关键设计：磁盘目录绝不直接对外 alias。
# 所有请求先经过 Django 鉴别 UUID → 命中后返回 X-Accel-Redirect 头
# → Nginx 在 internal 区域内取文件回传。浏览器无法直接构造
# /_protected/... 访问任意文件（internal 会返回 404）。
#
# 用法：
#   1. Django 侧开启 X-Accel（两个环境变量，见文件末尾说明）
#   2. 把本文件 include 到 nginx.conf 的 http 块中
#   3. 按实际盘符增删下面的 /_protected/<盘符>/ 区块
#   4. nginx -t 检查，再 nginx 启动
# ═══════════════════════════════════════════════════════════

upstream myvideopic_django {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen       80;
    server_name  localhost 127.0.0.1;

    charset utf-8;
    client_max_body_size 16m;      # 只有 JSON 请求，不需要大体积

    # 视频是长连接，别让 Nginx 中途掐断
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_http_version 1.1;

    # ── API ────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://myvideopic_django;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流式响应不缓冲，否则 Nginx 会先攒满整个视频再发
        proxy_buffering off;
    }

    # ── Django Admin（可选，仅本机可访问）──────────────────
    location /admin/ {
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://myvideopic_django;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Admin 的静态文件（先执行 python manage.py collectstatic）
    location /static/ {
        alias        C:/Users/Administrator/Desktop/MyVideoPic/backend/staticfiles/;
        access_log   off;
        expires      7d;
    }

    # ═══════════════════════════════════════════════════════
    # 零拷贝区：只能由 Django 的 X-Accel-Redirect 触发
    #
    # Django 把 D:\Movies\a.mkv 转成 /_protected/D/Movies/a.mkv，
    # 这里再映射回盘符。internal 保证外部直接请求一律 404。
    # 每加一块盘就复制一段，把两处字母同时改掉。
    # ═══════════════════════════════════════════════════════

    location /_protected/C/ {
        internal;
        alias C:/;
        sendfile      on;
        tcp_nopush    on;
        # aio         threads;      # Windows 版 Nginx 无此模块，仅 Linux 下启用
        output_buffers 4 512k;
        autoindex     off;
    }

    location /_protected/D/ {
        internal;
        alias D:/;
        sendfile      on;
        tcp_nopush    on;
        # aio         threads;
        output_buffers 4 512k;
        autoindex     off;
    }

    location /_protected/E/ {
        internal;
        alias E:/;
        sendfile      on;
        tcp_nopush    on;
        # aio         threads;
        output_buffers 4 512k;
        autoindex     off;
    }

    # ── 前端 ───────────────────────────────────────────────
    # 部署：直接发 npm run build 的产物
    location / {
        root  C:/Users/Administrator/Desktop/MyVideoPic/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;      # history 路由回落
    }

    # 开发期若想让 Nginx 前置 Vite dev server，把上面 location /
    # 整段换成下面这段（两者只能留一个）：
    #
    # location / {
    #     proxy_pass http://127.0.0.1:5173;
    #     proxy_set_header Host      $host;
    #     proxy_set_header Upgrade   $http_upgrade;   # HMR 走 WebSocket
    #     proxy_set_header Connection "upgrade";
    # }
}

# ═══════════════════════════════════════════════════════════
# 配套的 Django 环境变量
# ═══════════════════════════════════════════════════════════
#
#   set MYVIDEOPIC_X_ACCEL=1        启用 X-Accel-Redirect
#   set MYVIDEOPIC_DEBUG=0          生产模式
#   python manage.py collectstatic  生成 /static/ 内容
#
# 未设置 MYVIDEOPIC_X_ACCEL 时，Django 会自己读文件并回传 206，
# 功能完全一致，只是吞吐略低 —— 单人使用几乎察觉不到差别。
#
# 排查提示：
#   * 视频 404 而封面正常 → 对应盘符的 /_protected/<字母>/ 区块没配
#   * 视频 0 字节         → alias 少了结尾斜杠，或盘符大小写不符
#     （Django 统一输出大写盘符）
#   * 拖进度条无效        → 检查是否有代理层加了 proxy_buffering on
# ═══════════════════════════════════════════════════════════
