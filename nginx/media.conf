# MyVideoPic - Nginx production configuration for Windows.
#
# Put this file in the `http {}` block of nginx.conf with:
#   include C:/path/to/MyVideoPic/nginx/media.conf;
#
# Before starting, change only the myvideopic_root value below. The server
# listens on 127.0.0.1 only, so it stays a local-only application.

upstream myvideopic_django {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 127.0.0.1:80;
    server_name localhost 127.0.0.1;

    # The only project-specific path in this file.
    set $myvideopic_root C:/Users/Administrator/Desktop/MyVideoPic;

    charset utf-8;
    client_max_body_size 16m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_http_version 1.1;

    # All API requests remain same-origin and are handled by Django.
    location /api/ {
        proxy_pass http://myvideopic_django;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Optional Django Admin. It is still reachable only from this machine.
    location /admin/ {
        proxy_pass http://myvideopic_django;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Used by Django Admin after `python manage.py collectstatic`.
    location /static/ {
        alias $myvideopic_root/backend/staticfiles/;
        access_log off;
        expires 7d;
    }

    # Django verifies a media UUID first, then returns X-Accel-Redirect such
    # as /_protected/D/Movies/example.mkv. This regex maps every local drive
    # automatically. `internal` prevents direct browser access to any disk.
    location ~ ^/_protected/([A-Za-z])/(.+)$ {
        internal;
        alias $1:/$2;
        sendfile on;
        tcp_nopush on;
        output_buffers 4 512k;
        autoindex off;
    }

    # Vue production build. try_files preserves history-mode routes.
    location / {
        root $myvideopic_root/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
